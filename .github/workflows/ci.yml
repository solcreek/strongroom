name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Build, test and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The CLI must match the wasm-bindgen crate exactly; take its version from Cargo.lock so dependency bumps stay consistent.
      - name: wasm-bindgen version
        id: bindgen
        run: echo "version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/[^0-9.]/, ""); print }' Cargo.lock)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: npm run verify
      - run: npm run deploy:check
      - run: npm run test:package
      - name: Real OpenBao Transit integration and conformance
        run: |
          export TRANSIT_BIN="$(node scripts/install-transit.mjs)"
          npm run test:transit
          npm run test:live -- --provider openbao
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage
          retention-days: 14
      # The built host is reused by the container job, so the daemonless image matches what was tested.
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/server.js
            dist/strongroom_core_bg.wasm
          retention-days: 3

  container:
    name: Container images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: docker/setup-buildx-action@v4
      - name: Dockerfile build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: strongroom:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: npm run test:container
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: imjasonh/setup-crane@v0.7
      - name: Daemonless image (scripts/image.mjs) runs the same contract
        run: |
          crane registry serve --address 127.0.0.1:5000 &
          sleep 1
          node scripts/image.mjs --repository 127.0.0.1:5000/strongroom --platforms linux/amd64 > image.json
          cat image.json
          docker pull "$(node -p "require('./image.json').images[0]")"
          STRONGROOM_TEST_IMAGE="$(node -p "require('./image.json').images[0]")" npm run test:container

  iac:
    name: Deployment modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.6
      - name: Format and validate
        run: |
          tofu fmt -check -recursive deploy/terraform
          for m in deploy/terraform/*/; do tofu -chdir="$m" init -backend=false -input=false && tofu -chdir="$m" validate; done
