name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Rust and Wasm tooling
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --target wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.105 --locked
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: npm run verify
      - run: npm run deploy:check
      - run: npm run test:package
      - name: Real OpenBao Transit integration
        run: TRANSIT_BIN="$(node scripts/install-transit.mjs)" npm run test:transit
      - run: docker build -t strongroom:ci .
      - run: npm run test:container
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage
